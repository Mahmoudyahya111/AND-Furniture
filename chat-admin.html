<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Support console | AND.Furniture</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6b5a4c"><link rel="icon" href="img/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("and_theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}})()</script>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/premium.css">
<style>
body.cc{background:var(--bg);color:var(--ink);margin:0}
.cc header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.cc header .t{font-weight:800;font-size:17px;flex:1;white-space:nowrap}
.cc .b{padding:8px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
.cc .b.p{background:var(--gold);border-color:var(--gold);color:#241a10;font-weight:700}
.cc select,.cc input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.pres{display:flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--line);border-radius:99px}.pres select{border:0;padding:6px 2px;background:transparent}
.cc main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px 16px;max-width:1240px;margin:0 auto;height:calc(100vh - 70px)}
@media(max-width:820px){.cc main{grid-template-columns:1fr;height:auto}.cc.insel #lp{display:none}.cc:not(.insel) #conv{display:none}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--sh)}
.tabs{display:flex;gap:4px;padding:10px 10px 0}.tabs button{flex:1;padding:8px 4px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--muted);font:inherit}
.tabs button.on{color:var(--ink);border-color:var(--gold);font-weight:700}
.sr{margin:10px;width:calc(100% - 20px)}
#list{overflow-y:auto;flex:1;min-height:200px}
.it{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}.it.on,.it:hover{background:rgba(201,164,92,.14)}
.it .r{display:flex;justify-content:space-between;gap:8px;align-items:center}.it small{color:var(--muted)}
.tag{background:transparent!important;position:static!important;inset:auto!important;font-size:11px;padding:1px 9px;border-radius:99px;border:1px solid var(--gold);color:var(--gold-d);white-space:nowrap}.tag.cl{border-color:var(--line);color:var(--muted)}
.unr{background:var(--copper);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-inline-start:6px}
.ch{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.m{max-width:76%;padding:8px 13px;border-radius:14px;word-break:break-word}.cu{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}.st{align-self:flex-end;background:var(--gold);color:#241a10}
.sy{align-self:center;font-size:12px;color:var(--muted)}.m small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.ft{padding:12px 16px;border-top:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:8px}.row input[type=text]{flex:1;min-width:150px}
.empty{margin:auto;color:var(--muted);text-align:center;padding:30px}
.canned{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.canned button{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.back{display:none}@media(max-width:820px){.back{display:inline-block}}
</style></head>
<body class="cc"><div id="app"></div>
<script src="js/vendor/supabase.min.js"></script><script src="js/config.js"></script><script src="js/chat-console.js"></script><script src="js/theme.js" defer></script>
</body></html>
